name: auraboard
description: Offline tabletop RPG soundboard for game masters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.5.0
  flutter_soloud: ^5.4.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  wakelock_plus: ^1.8.2
  file_picker: ^13.4.1
  dynamic_color: ^2.1.0
  archive: ^4.7.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/demo_audio/
